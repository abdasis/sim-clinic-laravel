events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 20m;

    upstream php_fpm {
        server api:9000;
    }

    upstream web_server {
        server web:3000;
    }

    # === WEB — mebaclinic.com ===
    server {
        listen 80;
        server_name mebaclinic.com www.mebaclinic.com;

        # Static assets from TanStack Start client build (shared volume)
        location /assets/ {
            root /var/www/web-assets;
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            proxy_pass http://web_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # === API — api.mebaclinic.com ===
    server {
        listen 80;
        server_name api.mebaclinic.com;

        root /var/www/api/public;
        index index.php;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass php_fpm;
            fastcgi_param SCRIPT_FILENAME /var/www/api/public$fastcgi_script_name;
            include fastcgi_params;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
